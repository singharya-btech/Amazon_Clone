services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    image: aryasingh1234/amazone_clone:backend-v2
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_HOST=mongodb
      - FRONTEND_URL=http://localhost:3000

  frontend:
    build: ./frontend
    image: aryasingh1234/amazone_clone:frontend-v2
    ports:
      - "3000:3000"
    depends_on:
      - backend
