apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: gyrojojo/amazon-backend:v7

        ports:
        - containerPort: 8000

        env:
        - name: MONGODB_HOST
          value: mongodb-service