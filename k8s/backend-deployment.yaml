apiVersion: v1
kind: ConfigMap
metadata:
  name: marketplace-backend-config
  labels:
    app.kubernetes.io/part-of: marketplace
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://frontend-service,http://frontend-service:80"
  CORS_ALLOW_ALL_ORIGINS: "true"
  POSTGRES_HOST: database-service
  POSTGRES_PORT: "5432"
  POSTGRES_DB: marketplace
  POSTGRES_USER: marketplace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: marketplace
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: marketplace
    spec:
      restartPolicy: Always
      containers:
        - name: backend
          image: aryasingh1234/amazone_clone:backend-v2
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - >-
              python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: marketplace-backend-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: marketplace-secrets
                  key: django-secret-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketplace-secrets
                  key: postgres-password
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
