apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: amazon-clone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: amazon-clone-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: amazon-clone
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
